name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Flutter ${{ matrix.flutter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.41.9', '3.x'] # our floor and latest stable
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
      - name: Publish dry run
        run: |
          flutter pub publish --dry-run > "$RUNNER_TEMP/dry.txt" 2>&1 && exit 0
          cat "$RUNNER_TEMP/dry.txt"
          echo "::error title=git diff::$(git diff | head -60 | tr '\n' '|')"
          echo "::error title=pub publish --dry-run::$(tail -n 25 "$RUNNER_TEMP/dry.txt" | tr '\n' ' ')"
          exit 1
