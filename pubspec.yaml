name: duo_dynamic_sizing
description: Adaptive layout for the foldable iPhone Duo and any screen. Live hinge angle, posture, fold and camera regions, split panes, side navigation and a pose simulator.
version: 2.0.3

homepage: https://abojawdat.github.io/iPhone-Duo-package-/
repository: https://github.com/Abojawdat/iPhone-Duo-package-
issue_tracker: https://github.com/Abojawdat/iPhone-Duo-package-/issues
topics: [foldable, iphone-duo, responsive, adaptive, layout]
screenshots:
  - description: The iPhone Duo bends like a book and on a table while the live hinge angle counts down and the panes move off the 40 pt fold.
    path: doc/hinge.webp
  - description: Real Liquid Glass on iOS 26, the side rail on the open Duo and the floating bar on the upright Duo, with the page flowing on beneath.
    path: doc/glass.webp
  - description: The package running on every iPhone Duo pose, closed, open and in Split View.
    path: doc/iphone-duo.webp
  - description: Unfolding keeps the same email open while the list slides back in.
    path: doc/fold.webp
  - description: The same widgets on iPhone, Android foldables and iPad.
    path: doc/everywhere.webp
  - description: duo_dynamic_sizing, adaptive layout for the foldable iPhone Duo.
    path: doc/social.png

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.abojawdat.duo_dynamic_sizing
        pluginClass: DuoDynamicSizingPlugin
      ios:
        pluginClass: DuoDynamicSizingPlugin
      macos:
        dartPluginClass: DuoHardwarePlugin
        dartFileName: src/hardware.dart
      windows:
        dartPluginClass: DuoHardwarePlugin
        dartFileName: src/hardware.dart
      linux:
        dartPluginClass: DuoHardwarePlugin
        dartFileName: src/hardware.dart
      web:
        pluginClass: DuoHardwarePlugin
        fileName: src/hardware.dart
